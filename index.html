<!doctype html>
<html lang="nl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#5a8a4a" />
    <meta name="description" content="Land van Leren — educatieve games van Willow Games. Verover de eilanden door vragen te beantwoorden." />

    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Land van Leren" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>Land van Leren</title>
    <style>
      html, body { margin: 0; padding: 0; }
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      body {
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        background: #eaf3df;
      }
      button { font-family: inherit; }
      input { font-family: inherit; }
      @keyframes sway {
        0%, 100% { transform: rotate(-1.4deg); }
        50%      { transform: rotate(1.4deg); }
      }
      @keyframes bob {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-6px); }
      }
      @keyframes wave-slide {
        from { transform: translateX(0); }
        to   { transform: translateX(-50%); }
      }
      @keyframes sun-pulse {
        0%, 100% { transform: scale(1); }
        50%      { transform: scale(1.06); }
      }
      @keyframes pop-in {
        from { transform: scale(0.92); opacity: 0; }
        to   { transform: scale(1);    opacity: 1; }
      }
      @keyframes confetti-fall {
        0%   { transform: translateY(-30px) rotate(0deg);   opacity: 0; }
        12%  { opacity: 1; }
        100% { transform: translateY(420px) rotate(360deg); opacity: 0; }
      }
      @keyframes flag-raise {
        0%   { transform: scaleY(0) translateY(60px); opacity: 0; transform-origin: bottom; }
        70%  { transform: scaleY(1.1) translateY(0); opacity: 1; transform-origin: bottom; }
        100% { transform: scaleY(1) translateY(0); opacity: 1; transform-origin: bottom; }
      }
      @keyframes boss-shake {
        0%, 100% { transform: translateX(0); }
        20%      { transform: translateX(-8px) rotate(-3deg); }
        40%      { transform: translateX(8px) rotate(3deg); }
        60%      { transform: translateX(-6px) rotate(-2deg); }
        80%      { transform: translateX(6px) rotate(2deg); }
      }
      @keyframes leaf-fall {
        0%   { transform: translate3d(0, -60px, 0) rotate(0deg);    opacity: 0; }
        10%  { opacity: 0.9; }
        90%  { opacity: 0.85; }
        100% { transform: translate3d(40px, 110vh, 0) rotate(540deg); opacity: 0; }
      }
      @keyframes pop-bubble {
        0%   { transform: translate(-50%, 0) scale(0.4);   opacity: 0; }
        20%  { transform: translate(-50%, -8px) scale(1.18); opacity: 1; }
        60%  { transform: translate(-50%, -32px) scale(1);   opacity: 1; }
        100% { transform: translate(-50%, -56px) scale(0.95); opacity: 0; }
      }
      @keyframes bear-hop {
        0%   { transform: translateY(0)    rotate(0deg); }
        35%  { transform: translateY(-22px) rotate(-6deg); }
        70%  { transform: translateY(-4px)  rotate(2deg); }
        100% { transform: translateY(0)    rotate(0deg); }
      }
      @keyframes bear-stumble {
        0%   { transform: translateY(0)   rotate(0deg); }
        25%  { transform: translateY(2px)  rotate(-14deg); }
        60%  { transform: translateY(4px)  rotate(8deg); }
        100% { transform: translateY(0)   rotate(0deg); }
      }
      @keyframes step-glow {
        0%   { box-shadow: 0 0 0 0   rgba(90, 168, 80, 0.85); }
        100% { box-shadow: 0 0 0 16px rgba(90, 168, 80, 0); }
      }
      @keyframes sparkle {
        0%   { transform: scale(0)   rotate(0deg);   opacity: 0; }
        40%  { transform: scale(1.2) rotate(140deg); opacity: 1; }
        100% { transform: scale(0.5) rotate(360deg); opacity: 0; }
      }
      @keyframes leg-walk-a {
        0%, 100% { transform: translateY(0); }
        50%      { transform: translateY(-2.6px); }
      }
      @keyframes leg-walk-b {
        0%, 100% { transform: translateY(-2.6px); }
        50%      { transform: translateY(0); }
      }
      @keyframes wolf-flee {
        0%   { transform: translate(0, 0)        rotate(0deg)  scale(1);    opacity: 1; }
        18%  { transform: translate(50px, -16px) rotate(10deg) scale(1);    opacity: 1; }
        38%  { transform: translate(110px, -4px) rotate(-6deg) scale(0.92); opacity: 1; }
        58%  { transform: translate(170px, -18px) rotate(12deg) scale(0.78); opacity: 0.9; }
        78%  { transform: translate(230px, -8px)  rotate(-3deg) scale(0.6);  opacity: 0.55; }
        100% { transform: translate(300px, -20px) rotate(20deg) scale(0.35); opacity: 0; }
      }
      @keyframes bear-celebrate {
        0%, 100% { transform: translateY(0)   rotate(0deg); }
        25%      { transform: translateY(-16px) rotate(-4deg); }
        50%      { transform: translateY(-2px)  rotate(0deg); }
        75%      { transform: translateY(-16px) rotate(4deg); }
      }
      @keyframes star-orbit {
        0%   { transform: rotate(0deg) translateX(38px) rotate(0deg); }
        100% { transform: rotate(360deg) translateX(38px) rotate(-360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
